<!doctype html>
<html lang="cs">
<head>

<body>
<canvas id="grid" aria-hidden="true"></canvas>

<header class="topbar">

      </div>
      <div>
        <span class="c-label" data-t="phone">Telefon</span>
        <a class="c-value" href="tel:+420775026558">+420&nbsp;775&nbsp;026&nbsp;558</a>

  <footer class="credit"><span data-t="credit">Web by</span> <a href="https://filipmracek.com" target="_blank" rel="noopener">filipmracek.com</a></footer>
